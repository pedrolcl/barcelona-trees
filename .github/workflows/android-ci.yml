name: Android CI

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: "android_x86_64", abi: "x86_64", triplet: "x64-android" }
          - { arch: "android_arm64_v8a", abi: "arm64_v8a", triplet: "arm64-android" }
    runs-on: ubuntu-26.04
    name: 'Android ${{ matrix.abi }}'

    steps:
    - name: Checkout recursive
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.3'
        host: 'linux'
        target: 'android'
        arch: ${{ matrix.arch }}
        modules: 'qtlocation qtpositioning'

    - name: 'Build vcpkg'
      uses: johnwason/vcpkg-action@v8
      id: vcpkg
      with:
        pkgs: libarchive
        triplet: ${{ matrix.triplet }}
        token: ${{ github.token }}
        revision: master

    - name: 'Check Android Environment'
      run: |
        echo "ANDROID_NDK: ${ANDROID_NDK}"
        echo "ANDROID_NDK_HOME: ${ANDROID_NDK_HOME}"
        echo "ANDROID_NDK_ROOT: ${ANDROID_NDK_ROOT}"
        echo "ls ${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}/include"
        ls -la ${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}/include
        echo "ls ${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}/lib"
        ls -la ${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}/lib
        echo "QT_ROOT_DIR: ${QT_ROOT_DIR}"
        echo "ls ${QT_ROOT_DIR}/lib/cmake/"
        ls -la ${QT_ROOT_DIR}/lib/cmake/
        echo "-DCMAKE_PREFIX_PATH=${QT_ROOT_DIR};${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}"

    - name: 'Configure CMake'
      id: configuration
      run: >
        cmake --debug-find-pkg=Qt6,LibArchive ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
        -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=Debug
        -DQt6_ROOT=${QT_ROOT_DIR}/lib/cmake
        -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake
        -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
        -DVCPKG_MANIFEST_MODE=OFF
        -DANDROID_ABI=${{ matrix.abi }}
        -DANDROID_PLATFORM=android-28
        -DANDROID_STL=c++_shared
        -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=ON
        -DQT_USE_TARGET_ANDROID_BUILD_DIR=ON

    - name: 'Build'
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      run: cmake --build ${{github.workspace}}/build --config Debug

    - name: 'Upload artifact'
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: build/barnatrees/android-build-barnatrees/build/outputs/apk/debug/*.apk
        retention-days: 90
        overwrite: true
